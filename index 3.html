<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>
:root{--bg:#06181b;--cd:#0e2a2d;--gold:#e8b94a;--gold2:#b8862b;--teal:#1f7a72;--pa:#f0dfb0;--tx:#f4ecd8;--mu:#9fb8b0}

header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px 0;border-bottom:1px solid #e8b94a40;position:sticky;top:0;background:#06181bf2;z-index:5;flex-wrap:wrap}

main{max-width:720px;margin:0 auto;padding:16px}.card{background:linear-gradient(160deg,#0f3033,#0b2225);border:1px solid #e8b94a40;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 6px 24px #0006}
input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;border-radius:10px;border:1px solid #e8b94a30;background:#08201f;color:var(--tx);font:inherit}

button.g{background:#ffffff14;color:var(--tx);font-weight:700}button.r{background:#a8322c;color:#fff}a.b{display:inline-block;background:#ffffff14;color:var(--tx);border-radius:10px;padding:10px 14px;text-decoration:none;margin:2px 4px 2px 0;font-weight:700}
.m{font-size:14px;margin:6px 0;min-height:1em}.ok{color:#5dffb0}.er{color:#ff8a8a}.mu{color:var(--mu);font-size:14px}
.bar{height:10px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}

details summary{cursor:pointer;color:var(--gold);font-weight:700}td{padding:4px 8px;border-bottom:1px solid #ffffff12}
.tick{flex:1 1 100%;margin:0 -16px;overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#6e1d18,#a8322c,#6e1d18);border-top:1px solid var(--gold);color:#fff;font-weight:700;font-size:14px}
.tick span{display:inline-block;padding:6px 0 6px 100%;animation:tk 30s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}
.hero{text-align:center;padding:8px 0 4px}.hero img{display:block;margin:0 auto}.lg1{width:min(62%,280px)}.lg2{width:min(92%,440px);margin-top:-4px!important}
.car{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--gold2);box-shadow:0 0 30px #e8b94a33;background:#000;aspect-ratio:1264/842;margin:10px 0}

.dots{position:absolute;bottom:8px;left:0;right:0;text-align:center}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff6;margin:0 3px}.dots i.on{background:var(--gold)}
.info{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.info span{background:#e8b94a1f;border:1px solid #e8b94a55;border-radius:20px;padding:5px 12px;font-size:14px}
.cd{text-align:center;color:var(--pa);font-family:Georgia,serif}.cd b{font-size:34px;color:var(--gold)}
footer{text-align:center;padding:20px 16px 40px;color:var(--mu);font-size:14px}footer .pl{display:inline-block;background:#fff;border-radius:10px;padding:8px 16px;margin-bottom:10px}footer .pl img{height:32px;display:block}

<main>

<script>
// Même config Firebase que index.html
const FIREBASE_CONFIG={apiKey:"AIzaSyC5SFPR4bToF7h7aSUnOGwsOnwKszLFiuk",authDomain:"otaexperience-2111d.firebaseapp.com",projectId:"otaexperience-2111d",storageBucket:"otaexperience-2111d.firebasestorage.app",messagingSenderId:"692441012930",appId:"1:692441012930:web:5a13d55d6bdaa8aefa795b"};
const OWNER='otaworld243@gmail.com';let ROLE=null;
const CODES="X7K2 M9R5 Q4T8 B7N3 K8W6 R5X9 V2M7 T8Q4 Y6K3 P9W7 C4R8 H7T5 N8X2 W3K9 F6M8 J2Q7 L9T4 X5R8 Z7K6 D8W2 G4N9 M2X8 P7T3 R8K5 T6W9 V4Q2 Y8M7 K3R6 N7W4 X9T2 B5K8 C7M4 F8Q6 H3R9 J7W2 L4X8 P8K3 R2M7 T9Q5 V7R4 W8K2 Y3M9 Z6T7 D4Q8 G7R3 K9W5 M8X4 N3K7 P6R2 T7M8 V9Q4 X2W7 Y7K8 B4T6 C8R5 F2M9 H8W3 J4K7 L7Q2 N9R8 P3W6 R7K4 T2M8 V8X5 W4Q7 Y9T3 Z2K8 D7R6 G8M4 K4W9 M7Q3 N2T8 P8R4 R4K9 T7W6 V3M8 X8Q2 Y4R7 B9K5 C2W8 F7M3 H9Q6 J3R8 L8K4 N4W7 P9M2 R6Q8 T4K7 V7W3 X3M9 Y8R2 Z4Q7 D9K3 G2W8 K7M4 M4R9 N8Q3 P2K7 R9W4 T3M8".split(' ');
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(i,t,ok)=>{$(i).textContent=t;$(i).className='m '+(ok?'ok':'er')};
if(FIREBASE_CONFIG.apiKey.startsWith('VOTRE'))$('cfgwarn').hidden=false;
firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue,C=n=>db.collection(n);
auth.onAuthStateChanged(async u=>{
 if(!u){$('adlog').hidden=false;$('adm').hidden=true;return}
 const em=(u.email||'').toLowerCase();let ok=false;
 if(u.emailVerified){ok=em===OWNER;if(!ok)try{ok=(await C('admins').doc(em).get()).exists}catch(e){}}
 if(!ok){await auth.signOut();msg('am','Accès refusé : ce compte n\'est pas administrateur.');return}
 ROLE=em===OWNER?'owner':'admin';$('adlog').hidden=true;$('adm').hidden=false;adm('reg')});
// ====== ADMIN ======
const gin=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>msg('am',x.message));
const tabs=t=>`<div class="card">${ROLE==='owner'?'<button onclick="adm(\'team\')">Équipe</button>':''}<button onclick="adm('reg')">Inscriptions</button><button onclick="adm('mis')">Missions</button><button onclick="adm('sub')">Réponses</button><button onclick="adm('cod')">Codes</button><button onclick="adm('site')">Affiches & rappel</button><button onclick="adm('cards')">Cartes</button><button class="g" onclick="auth.signOut()">Déconnexion</button></div>`;
async function adm(t){const el=$('adm');el.innerHTML=tabs()+'<div id="ad"></div>';const A=$('ad');
 if(t==='reg'){const s=await C('players').orderBy('createdAt','desc').limit(200).get();A.innerHTML=s.docs.map(d=>{const p=d.data(),w=p.whatsapp.replace(/\D/g,'').replace(/^0/,'243'),tx=`Bonjour ${p.pseudo} ! Ton inscription à OtaExperience 2026 est validée ✅\nTon ID d'aventurier : ${p.code}\nConnecte-toi sur ${location.origin.replace('null','')}${location.pathname} avec cet ID.`;
  return `<div class="card">${p.photo?`<img src="${p.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;float:right">`:''}<b>${E(p.pseudo)}</b> — ${E(p.nom)} <span class="tag">${p.status==='valid'?E(p.code):'en attente'}</span><div class="mu">${E(p.email)} · ${E(p.whatsapp)} · ${E(p.commune)} · ${p.age} ans<br>Réf. paiement : <b>${E(p.ref)}</b></div>`+
  (p.status==='pending'?`<button onclick="val('${d.id}')">✅ Valider & attribuer un ID</button><button class="r" onclick="if(confirm('Supprimer ?'))C('players').doc('${d.id}').delete().then(()=>adm('reg'))">Supprimer</button>`:`<a class="b" target="_blank" href="https://wa.me/${w}?text=${encodeURIComponent(tx)}">💬 WhatsApp</a><a class="b" href="mailto:${E(p.email)}?subject=${encodeURIComponent('Ton ID OtaExperience')}&body=${encodeURIComponent(tx)}">✉️ Email</a>`)+'</div>'}).join('')||'<div class="card mu">Aucune inscription.</div>'}
 if(t==='cod'){const s=await C('codes').get(),u=s.docs.filter(d=>d.data().used).length;A.innerHTML=`<div class="card"><h2>Codes d'aventurier</h2>${s.size} importés · ${u} attribués · ${s.size-u} libres<br><br><button onclick="seed()">Importer les ${CODES.length} codes</button><div class="m" id="sm"></div></div>`}
 if(t==='site')site(A);if(t==='cards')cards(A);if(t==='mis')mis(A);if(t==='sub')subs(A);if(t==='team'&&ROLE==='owner')team(A)}
async function seed(){const b=db.batch(),ex=new Set((await C('codes').get()).docs.map(d=>d.id));let n=0;[...new Set(CODES)].forEach(c=>{const id='OTA-'+c;if(!ex.has(id)){b.set(C('codes').doc(id),{used:false});n++}});await b.commit();msg('sm',n+' codes ajoutés.',1)}
async function val(id){const un=await C('codes').where('used','==',false).get();if(un.empty)return alert('Plus aucun code libre !');const cr=un.docs[Math.floor(Math.random()*un.size)].ref,pr=C('players').doc(id);
 try{await db.runTransaction(async t=>{const[c,p]=await Promise.all([t.get(cr),t.get(pr)]);if(c.data().used||p.data().status!=='pending')throw Error('Conflit, réessayez.');const bid=C('board').doc().id,pd=p.data();
  t.update(cr,{used:true,by:id});t.update(pr,{status:'valid',code:cr.id,bid});t.set(C('members').doc(cr.id),{pseudo:pd.pseudo,nom:pd.nom,commune:pd.commune,photo:pd.photo||'',xp:50,done:[],bid});t.set(C('board').doc(bid),{pseudo:pd.pseudo,xp:50})});adm('reg')}catch(x){alert(x.message)}}

// ====== CRÉATEUR DE MISSIONS (type Google Forms) ======
async function mis(A){const s=await C('missions').orderBy('at','desc').get();
 A.innerHTML=`<div class="card"><h2>➕ Nouvelle mission</h2><label>Titre</label><input id="mt"><label>Énoncé / histoire</label><textarea id="md" rows="3"></textarea>
 <div class="row"><div><label>Difficulté</label><select id="mx"><option value="20">Facile (+20 XP)</option><option value="40">Moyenne (+40 XP)</option><option value="80">Difficile (+80 XP)</option><option value="30">QR code (+30 XP)</option></select></div></div><div id="qs"></div>
 <button class="g" onclick="qadd()">+ Question</button><button onclick="msave()">Publier la mission</button><div class="m" id="mm"></div></div><h2>Missions</h2>`+
 s.docs.map(d=>{const x=d.data();return `<div class="card"><b>${E(x.title)}</b> <span class="tag">+${x.xp} XP</span> <span class="tag">${x.open?'ouverte':'fermée'}</span><div><button class="g" onclick="C('missions').doc('${d.id}').update({open:${!x.open}}).then(()=>adm('mis'))">${x.open?'Fermer':'Ouvrir'}</button><button class="r" onclick="if(confirm('Supprimer ?'))Promise.all([C('missions').doc('${d.id}').delete(),C('keys').doc('${d.id}').delete()]).then(()=>adm('mis'))">Supprimer</button></div></div>`}).join('');qadd()}
function qadd(){const d=document.createElement('div');d.className='qr';d.innerHTML='<label>Question</label><input class="q"><div class="row"><div><label>Type</label><select class="t"><option value="text">Réponse courte</option><option value="choice">Choix multiple</option></select></div><div><label>Options (séparées par des virgules)</label><input class="o"></div></div><label>Bonne réponse (vérifiée par vous, invisible aux joueurs)</label><input class="a">';$('qs').appendChild(d)}
async function msave(){const qs=[...document.querySelectorAll('.qr')].map(r=>({q:r.querySelector('.q').value.trim(),t:r.querySelector('.t').value,o:r.querySelector('.o').value.split(',').map(s=>s.trim()).filter(Boolean),a:r.querySelector('.a').value.trim()})).filter(q=>q.q);
 if(!$('mt').value||!qs.length)return msg('mm','Titre et au moins une question.');const id=C('missions').doc().id,b=db.batch();
 b.set(C('missions').doc(id),{title:$('mt').value,desc:$('md').value,xp:+$('mx').value,open:true,qs:qs.map(({q,t,o})=>({q,t,o})),at:FV.serverTimestamp()});b.set(C('keys').doc(id),{a:qs.map(q=>q.a)});await b.commit();adm('mis')}

// ====== VALIDATION DES RÉPONSES ======
const nz=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function subs(A){const s=await C('subs').where('status','==','pending').get();if(s.empty)return A.innerHTML='<div class="card mu">Aucune réponse en attente.</div>';A.innerHTML='';
 for(const d of s.docs){const x=d.data(),[m,k]=await Promise.all([C('missions').doc(x.mid).get(),C('keys').doc(x.mid).get()]);if(!m.exists)continue;const M=m.data(),K=k.data().a;
  A.innerHTML+=`<div class="card"><b>${E(x.pseudo)}</b> <span class="tag">${E(x.code)}</span> — ${E(M.title)}`+M.qs.map((q,i)=>{const ok=nz(x.answers[i])===nz(K[i]);return `<div class="mu">${E(q.q)}<br>Réponse : <b>${E(x.answers[i])}</b> ${ok?'<span class="ok">✔ correcte</span>':'<span class="er">✘ attendue : '+E(K[i])+'</span>'}</div>`}).join('')+
  `<button onclick="sval('${d.id}','${x.code}','${x.mid}',${M.xp})">✅ Valider (+${M.xp} XP)</button><button class="r" onclick="C('subs').doc('${d.id}').update({status:'no'}).then(()=>adm('sub'))">Refuser</button></div>`}}
async function sval(id,code,mid,xp){const mr=C('members').doc(code),m=await mr.get();if(!(m.data().done||[]).includes(mid)){const b=db.batch();b.update(mr,{xp:FV.increment(xp),done:FV.arrayUnion(mid)});b.update(C('board').doc(m.data().bid),{xp:FV.increment(xp)});await b.commit()}
 await C('subs').doc(id).update({status:'ok'});adm('sub')}

async function team(A){const s=await C('admins').get();A.innerHTML=`<div class="card"><h2>👥 Équipe d'administration</h2><p class="mu">Seuls les comptes Google listés ici (et vous, propriétaire) peuvent ouvrir cette page. Tous les autres restent de simples joueurs.</p><input id="te" type="email" placeholder="email.google@gmail.com"><button onclick="tadd()">Ajouter un administrateur</button><div class="m" id="tm"></div></div><div class="card"><b>${OWNER}</b> <span class="tag">propriétaire</span></div>`+s.docs.map(d=>`<div class="card"><b>${E(d.id)}</b> <span class="tag">admin</span> <button class="r" onclick="if(confirm('Retirer cet administrateur ?'))C('admins').doc('${E(d.id)}').delete().then(()=>adm('team'))">Retirer</button></div>`).join('')}
async function tadd(){const e=$('te').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return msg('tm','Email invalide.');await C('admins').doc(e).set({email:e,at:FV.serverTimestamp()});adm('team')}
// ====== AFFICHES & RAPPEL DÉFILANT ======
const DEFTK="📢 RAPPEL : pour accéder à l'espace de la chasse au trésor le 19 décembre 2026, un paiement de 15 000 CDF est requis (en plus des 5 000 FC d'inscription).  ✦  Rejoins l'aventure, récupère les fragments, ouvre le portail !";
async function site(A){const[ps,tk]=await Promise.all([C('posters').orderBy('o').get(),C('settings').doc('ticker').get()]);
 A.innerHTML=`<div class="card"><h2>📢 Texte de rappel défilant</h2><p class="mu">Il défile en haut du site pour tous les visiteurs.</p><textarea id="tt" rows="4">${E(tk.exists?tk.data().text:DEFTK)}</textarea><button onclick="tsave()">Enregistrer</button><div class="m" id="tm2"></div></div>
 <div class="card"><h2>🖼️ Affiches de l'événement</h2><p class="mu">Elles défilent sur l'accueil (idéal : 1 à 5). S'il n'y en a aucune, l'affiche par défaut s'affiche. Pour changer d'événement : ajoutez la nouvelle, supprimez l'ancienne.</p><input type="file" id="pf" accept="image/*" multiple><button onclick="padd()">Ajouter</button><div class="m" id="pm"></div></div>`+
 ps.docs.map(d=>`<div class="card row" style="align-items:center"><img src="${d.data().img}" style="max-width:170px;border-radius:8px"><div><button class="g" onclick="pmove('${d.id}',-1)">⬆ Monter</button><button class="g" onclick="pmove('${d.id}',1)">⬇ Descendre</button><button class="r" onclick="if(confirm('Supprimer cette affiche ?'))C('posters').doc('${d.id}').delete().then(()=>adm('site'))">Supprimer</button></div></div>`).join('')}
async function tsave(){await C('settings').doc('ticker').set({text:$('tt').value.trim(),at:FV.serverTimestamp()});msg('tm2','✅ Enregistré : visible tout de suite sur le site.',1)}
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{let w=Math.min(1100,im.width),q=.82,u;for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',q);if(u.length<340000)break;q-=.08;w=Math.round(w*.88)}r(u)};im.src=URL.createObjectURL(f)})}
async function padd(){const fs=[...$('pf').files];if(!fs.length)return msg('pm','Choisissez au moins une image.');msg('pm','Envoi en cours…',1);let k=0;for(const f of fs)await C('posters').add({img:await shrink(f),o:Date.now()+k++,at:FV.serverTimestamp()});adm('site')}
async function pmove(id,dir){const s=await C('posters').orderBy('o').get(),a=s.docs,i=a.findIndex(d=>d.id===id),j=i+dir;if(j<0||j>=a.length)return;const b=db.batch();b.update(a[i].ref,{o:a[j].data().o});b.update(a[j].ref,{o:a[i].data().o});await b.commit();adm('site')}
// ====== CARTE DE PARTICIPANT ======
const CARD_CFG={title:"CARTE D'AVENTURIER",event:"Grande finale · 19 déc. 2026 · Maison Safina (Salama)",note:"À présenter à l'entrée · Accès espace chasse au trésor : 15 000 CDF",accent:"#e8b94a"};
const rk=x=>x>=900?'Maître d’Ôta':x>=500?'Chasseur':x>=200?'Aventurier':'Explorateur';
const ldImg=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function drawCard(cv,p,cfg,logo){cfg={...CARD_CFG,...(cfg||{})};const W=1011,H=638,x=cv.getContext('2d'),ac=cfg.accent;cv.width=W;cv.height=H;
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#10403f');g.addColorStop(1,'#051315');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle=ac+'26';x.lineWidth=2;for(let i=1;i<7;i++){x.beginPath();x.arc(W-50,70,i*85,0,7);x.stroke()}
 x.strokeStyle=ac;x.lineWidth=6;rr(x,12,12,W-24,H-24,28);x.stroke();
 const lg=await ldImg(logo);if(lg){const w=250,h=w*lg.height/lg.width;x.drawImage(lg,42,38,w,h)}
 x.fillStyle=ac;x.textAlign='right';x.font='bold 27px Georgia,serif';x.fillText(cfg.title,W-45,72,520);
 x.fillStyle=ac+'55';x.fillRect(42,128,W-84,2);
 // photo
 const cx=170,cy=355,R=115;x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();x.fillStyle='#0b2a2d';x.fillRect(cx-R,cy-R,2*R,2*R);
 const ph=await ldImg(p.photo);if(ph){const s=Math.min(ph.width,ph.height);x.drawImage(ph,(ph.width-s)/2,(ph.height-s)/2,s,s,cx-R,cy-R,2*R,2*R)}else{x.fillStyle=ac;x.font='bold 130px Georgia,serif';x.textAlign='center';x.fillText((p.pseudo||'?')[0].toUpperCase(),cx,cy+45)}
 x.restore();x.strokeStyle=ac;x.lineWidth=7;x.beginPath();x.arc(cx,cy,R+4,0,7);x.stroke();

const SAMPLE={pseudo:'PSEUDO',nom:'Nom Prénom',code:'OTA-X7K2',xp:0,commune:'Commune'};let CP=[],CFG={};
async function cards(A){const[s,c,m]=await Promise.all([C('players').where('status','==','valid').get(),C('settings').doc('card').get(),C('members').get()]);const mem={};m.docs.forEach(d=>mem[d.id]=d.data());
 CFG={...CARD_CFG,...(c.exists?c.data():{})};CP=s.docs.map(d=>({...d.data(),xp:(mem[d.data().code]||{}).xp??50}));
 A.innerHTML=`<div class="card"><h2>🎫 Modèle de la carte</h2><label>Titre</label><input id="ct" value="${E(CFG.title)}"><label>Ligne événement</label><input id="ce" value="${E(CFG.event)}"><label>Note en bas</label><input id="cn" value="${E(CFG.note)}"><label>Couleur d'accent</label><input id="ca" type="color" value="${CFG.accent}" style="height:46px"><button onclick="csave()">Enregistrer le modèle</button><div class="m" id="cm"></div><canvas id="pv" style="width:100%;border-radius:12px"></canvas></div>
 <div class="card"><h2>Cartes des participants (${CP.length})</h2><input id="cs" placeholder="Rechercher un ID, pseudo ou nom…" oninput="cf()"><button onclick="syncCards()">🔄 Mettre à jour les infos des cartes</button><button class="g" onclick="pall()">🖨️ Imprimer toutes les cartes</button><div class="m" id="sy"></div><div id="cl"></div></div>`;
 drawCard($('pv'),CP[0]||SAMPLE,CFG,CARD_LOGO);cf()}
function cf(){const q=($('cs').value||'').toLowerCase();$('cl').innerHTML=CP.map((p,i)=>[p,i]).filter(([p])=>((p.code||'')+p.pseudo+p.nom).toLowerCase().includes(q)).map(([p,i])=>`<div class="card" style="margin:8px 0"><b>${E(p.pseudo)}</b> <span class="tag">${E(p.code)}</span><div class="mu">${E(p.nom)} · ${p.xp} XP</div><button class="g" onclick="cview(${i})">Aperçu</button><button onclick="cdl(${i})">⬇ PNG</button></div>`).join('')||'<div class="mu">Aucun résultat.</div>'}
async function cview(i){await drawCard($('pv'),CP[i],CFG,CARD_LOGO);$('pv').scrollIntoView({behavior:'smooth'})}
async function cdl(i){const c=document.createElement('canvas');await drawCard(c,CP[i],CFG,CARD_LOGO);const a=document.createElement('a');a.download='carte-'+CP[i].code+'.png';a.href=c.toDataURL('image/png');a.click()}
async function csave(){CFG={title:$('ct').value,event:$('ce').value,note:$('cn').value,accent:$('ca').value};await C('settings').doc('card').set(CFG);msg('cm','✅ Modèle enregistré : les joueurs verront ce design.',1);drawCard($('pv'),CP[0]||SAMPLE,CFG,CARD_LOGO)}
async function syncCards(){const b=db.batch();CP.forEach(p=>b.update(C('members').doc(p.code),{nom:p.nom||'',commune:p.commune||'',photo:p.photo||''}));await b.commit();msg('sy','✅ '+CP.length+' cartes mises à jour.',1)}
async function pall(){const w=window.open('','_blank');if(!w)return alert('Autorisez les fenêtres pop-up pour imprimer.');w.document.write('<p>Préparation des cartes…</p>');const im=[];for(const p of CP){const c=document.createElement('canvas');await drawCard(c,p,CFG,CARD_LOGO);im.push(c.toDataURL('image/png'))}
 w.document.open();w.document.write('<style>@page{margin:8mm}body{margin:0}img{width:86mm;margin:2mm;break-inside:avoid}</style>'+im.map(u=>'<img src="'+u+'">').join(''));w.document.close();setTimeout(()=>w.print(),700)}
</script></body></html>
